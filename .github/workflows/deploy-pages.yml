name: deploy

# Publishes the site to GitHub Pages. Berean is static — no build step, no server,
# no secrets — so this only has to upload the repo and point Pages at it.
#
# The site must be served from the REPO ROOT: web/ fetches ../library/, and the
# root index.html redirects to web/. Do not publish web/ on its own.
#
# One-time setup is DONE (2026-08-18): the repo is public and Pages is on with
# build_type=workflow, so the push trigger below is now live.
#
# It was workflow_dispatch-only while Pages was off, which was right at the time —
# an automatic trigger would have failed on every push and left the repo red for
# something that was not broken. That is no longer true, and leaving it manual has
# its own cost: bereanlamp.com fell 12 commits behind precisely because publishing
# needed someone to remember. A deploy that depends on memory is the failure mode.
#
# The CNAME file at the repo root is what binds this artifact to bereanlamp.com.
# It must stay at the ROOT for the same reason the site does — the rsync below
# copies the root, so CNAME travels with it. Deleting it unsets the custom domain
# on the next deploy.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    name: verify the library first
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 scripts/check_all.py

  deploy:
    name: publish
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage the site (the repo root, minus what nobody needs to download)
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' \
                --exclude 'research' --exclude 'scripts/__pycache__' ./ _site/
          du -sh _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
